<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>群組房間 · Session Bridge</title>
  <link rel="stylesheet" href="/room.css">
  <script src="/room.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><h1 id="title">群組房間</h1><p id="connection" role="status">正在連線</p></div>
      <label class="filter">顯示成員 <select id="filter"><option value="">全部成員</option></select></label>
    </header>
    <section id="messages" aria-label="房間訊息" tabindex="0">
      <p id="empty">房間還沒有訊息。</p>
    </section>
    <form id="compose">
      <div id="reply" hidden><span></span><button type="button" id="cancel-reply">取消回覆</button></div>
      <label for="text">發言</label>
      <textarea id="text" rows="3" maxlength="8000" placeholder="輸入訊息，用 @別名 點名成員"></textarea>
      <ul id="uploads" aria-label="待送附件"></ul>
      <p id="error" role="alert"></p>
      <div class="actions">
        <label class="file">選擇檔案 <input type="file" id="files" multiple></label>
        <span>也可貼上截圖或拖入檔案</span>
        <button type="submit" id="send" disabled>發送</button>
      </div>
    </form>
  </main>
  <dialog id="preview">
    <form method="dialog"><button aria-label="關閉圖片預覽">關閉</button></form>
    <img id="full-image" alt="">
  </dialog>
</body>
</html>
